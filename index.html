<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fbf6f2;--dim:rgba(250,240,232,.68);--glass:rgba(255,255,255,.075);--edge:rgba(255,255,255,.15);
 --live:#ff5c6c;--bg:#0c0709;--b1:#ff7a45;--b2:#c2255c;--b3:#7a3aa8;--glow:.5}
:root[data-theme="aurora"]{--ink:#f6f5ff;--dim:rgba(238,236,255,.7);--bg:#070614;--b1:#3d6bff;--b2:#a93bff;--b3:#ff4fa8;--glow:.55}
:root[data-theme="graphite"]{--ink:#f5f6f8;--dim:rgba(235,238,244,.66);--bg:#08090b;--b1:#56627a;--b2:#2e3647;--b3:#6b7a94;--glow:.42}
:root[data-theme="forest"]{--ink:#f1f8f4;--dim:rgba(230,243,236,.66);--bg:#040b08;--b1:#12895f;--b2:#0e5c46;--b3:#2a7da0;--glow:.5}
:root[data-theme="midnight"]{--ink:#f4f6ff;--dim:rgba(235,240,255,.62);--bg:#04050d;--b1:#2b5cff;--b2:#9a3dff;--b3:#00d6b4;--glow:.55}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;overflow:hidden;cursor:none}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0}
.aurora i{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:var(--glow);animation:drift 50s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--b1);left:-15vw;top:-20vw}
.aurora i:nth-child(2){background:var(--b2);right:-20vw;top:5vw;animation-duration:65s}
.aurora i:nth-child(3){background:var(--b3);left:25vw;bottom:-35vw;opacity:calc(var(--glow)*.75);animation-duration:80s}
@keyframes drift{to{transform:translate(12vw,8vh) scale(1.2)}}
#shift{position:relative;z-index:1;height:100%;padding:4vh 4vw;display:grid;gap:2.2vh 1.6vw;
 grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:1.05fr 1.05fr 1fr;
 grid-template-areas:"clock wx wx" "fc sun air" "news sports sports";transition:transform 4s ease}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:2.2vh;padding:2vh 1.5vw;
 backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);overflow:hidden;min-width:0;min-height:0}
.card h2{font-size:1.7vh;font-weight:600;color:var(--dim);margin-bottom:1.2vh;letter-spacing:.02em}
#clock{grid-area:clock;background:none;border:none;backdrop-filter:none;padding:0;display:flex;flex-direction:column;justify-content:center}
#time{white-space:nowrap;font-size:14vh;font-weight:200;line-height:1;letter-spacing:-.03em}
#time small{font-size:2.8vh;font-weight:300;margin-left:1.8vw;color:var(--dim);letter-spacing:.06em}
#date{font-size:3.2vh;font-weight:300;color:var(--dim);margin-top:1.8vh}
#wx{grid-area:wx;display:flex;align-items:center;gap:2vw}
#wxicon{font-size:11vh}
#temp{font-size:11vh;font-weight:200;line-height:1}
#wxdesc{font-size:3vh;font-weight:300}
#wxsub{font-size:2.1vh;color:var(--dim);margin-top:.6vh}
#fc{grid-area:fc}.hours,.days{display:flex;justify-content:space-between;height:calc(100% - 3vh);align-items:center}
.day{text-align:center;font-size:1.9vh}.day b{display:block;font-weight:400;color:var(--dim);margin-bottom:.4vh}
.day span{display:block;font-size:3.6vh;margin:.3vh 0}.day em{font-style:normal;color:var(--dim)}
#sun{grid-area:sun}#air{grid-area:air}
.cols{display:flex;gap:1.2vw}.cols>div{flex:1;min-width:0}
.big{font-size:4.4vh;font-weight:200;line-height:1.1;white-space:nowrap}
.row{font-size:1.9vh;color:var(--dim);margin-top:.5vh}
.moonrow{display:flex;align-items:center;gap:1vw;margin-top:2vh}
#moon{font-size:5vh;line-height:1}#moontxt{font-size:2vh;color:var(--dim);line-height:1.3}
.meter{height:.9vh;border-radius:1vh;background:rgba(255,255,255,.12);margin-top:1.2vh;overflow:hidden}
.meter div{height:100%;border-radius:1vh;background:linear-gradient(90deg,#00d6b4,#ffd84a,#ff5c7a);transition:width 1s}
#news{grid-area:news}#sports{grid-area:sports}
.head{font-size:2.6vh;font-weight:300;line-height:1.3;transition:opacity .8s;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.head.sub{font-size:1.9vh;color:var(--dim);margin-top:1.1vh;-webkit-line-clamp:1}
.src{font-size:1.6vh;color:var(--dim);margin-top:1.2vh}
.leagues{display:flex;gap:1vw;height:calc(100% - 3vh)}
.lg{flex:1;min-width:0;background:rgba(255,255,255,.055);border-radius:1.6vh;padding:1.2vh .9vw;overflow:hidden}
.lg h3{font-size:1.8vh;font-weight:600;margin-bottom:.7vh}
.g{display:flex;justify-content:space-between;gap:.6vw;font-size:1.85vh;padding:.45vh 0;white-space:nowrap}
.g b{font-weight:400;overflow:hidden;text-overflow:ellipsis}.g span{color:var(--dim);font-size:1.6vh;flex:none;align-self:center}
.g .live{color:#ff6b8a}
.nx{display:flex;justify-content:space-between;align-items:center;gap:1vw;font-size:2.1vh;padding:.7vh 0;border-bottom:1px solid rgba(255,255,255,.08)}.nx:last-child{border:0}.nx>span:last-child{color:var(--dim);flex:none}.nx .logo{width:3.2vh;height:3.2vh}
#wx>div:nth-child(2){max-width:36%;flex:none}
.map{position:relative;flex:1;min-width:0;align-self:stretch;border-radius:1.6vh;overflow:hidden;background:#0b0b12}
.map .rt{position:absolute;left:50%;top:50%}.map img{position:absolute;width:256px;height:256px;max-width:none}
.map .rf{opacity:0;transition:opacity .3s}
.pin{position:absolute;left:50%;top:50%;width:1.3vh;height:1.3vh;margin:-.65vh;border-radius:50%;background:#fff;box-shadow:0 0 0 .5vh rgba(255,255,255,.3)}
.mcap{position:absolute;left:.7vw;bottom:.6vh;font-size:1.2vh;color:rgba(255,255,255,.7);text-shadow:0 0 4px #000}
.mtime{position:absolute;right:.7vw;top:.6vh;font-size:1.5vh;color:#fff;text-shadow:0 0 4px #000}
.stg{display:grid;grid-template-columns:1fr 1fr;column-gap:2vw}
.st{display:flex;align-items:baseline;gap:.6vw;font-size:1.9vh;padding:.45vh 0;color:var(--dim)}
.st i{font-style:normal;width:1.2vw}.st b{font-weight:400;color:var(--ink);flex:1}.st em{font-style:normal;color:var(--ink);width:2.2vw;text-align:right}
.st.me b,.st.me em{font-weight:600;color:#ffd1ec}
.pgn{font-weight:400;color:var(--dim);font-size:1.5vh;margin-left:.6vw}
.none{font-size:1.8vh;color:var(--dim)}
.why{font-size:1.4vh;color:var(--dim);opacity:.75;margin-top:.6vh;line-height:1.3}
#live{grid-area:news;display:none;flex-direction:column;justify-content:space-between;border-color:rgba(255,110,120,.5)}
.lvtag{font-size:1.8vh;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:.6vw}
.dot{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;font-size:4.6vh;font-weight:300;line-height:1.12;font-variant-numeric:tabular-nums}
.lvrow.fav{font-weight:600}
.tm{display:flex;align-items:center;gap:.9vw;min-width:0}.tm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:5.2vh;height:5.2vh;object-fit:contain;flex:none;border-radius:50%;background:rgba(255,255,255,.1);padding:.4vh}
#lvClock{font-size:3vh;font-weight:400;font-variant-numeric:tabular-nums}
#live.flash{animation:flash 1s ease 5}
@keyframes flash{50%{background:rgba(255,255,255,.3)}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main id="shift">
 <section id="clock" class="card"><div id="time"></div><div id="date"></div></section>
 <section id="wx" class="card"><div id="wxicon">⛅</div><div><div id="temp">--°</div><div id="wxdesc">Loading…</div><div id="wxsub"></div></div><div class="map" id="radar"></div></section>
 <section id="fc" class="card"><h2>Next 5 days</h2><div class="days"></div></section>
 <section id="sun" class="card"><h2>Sun and moon</h2>
  <div class="cols"><div><div class="big" id="sunrise">--</div><div class="row">Sunrise</div></div>
  <div><div class="big" id="sunset">--</div><div class="row">Sunset</div></div></div>
  <div class="moonrow"><div id="moon"></div><div id="moontxt"></div></div></section>
 <section id="air" class="card"><h2>Next 12 hours</h2>
<div class="hours" id="hours"></div></section>
 <section id="news" class="card"><h2 id="pgTitle">Up next · your teams</h2><div id="nextList"></div><div class="stg" id="stdNHL"></div><div class="stg" id="stdOHL"></div></section>
 <section id="live" class="card"><div class="lvtag" id="lvTag"></div><div><div class="lvrow" id="lvA"></div><div class="lvrow" id="lvH"></div></div><div id="lvClock"></div></section>
 <section id="sports" class="card"><h2>Scores</h2><div class="leagues" id="leagues"></div></section>
</main>
<script>
/* ===== SETTINGS: edit these ===== */
const CFG={
  city:'Woodstock', lat:43.13, lon:-80.75,
  clock24:false,
  // Colour theme: 'aurora' (blue, purple, pink), 'dusk' (warm amber and rose), 'graphite' (neutral dark), 'forest' (green), 'midnight' (the original blue and violet)
  theme:'aurora',
  // Scores: one box per league, shown left to right.
  // type 'espn' covers NHL, MLB, NBA etc. ('sport/league' as ESPN names them).
  // type 'hockeytech' covers the OHL (ESPN doesn't carry it).
  // fav: your teams. When one is live (or starts within 30 min) a live scorebug with game clock replaces the headlines.
  // teams: abbreviations to show only those games, e.g. ['TOR'] or ['LDN']. [] shows all games.
  leagues:[
    {type:'espn', sport:'baseball', league:'mlb', label:'MLB', teams:[], fav:['TOR']},
    {type:'hockeytech', code:'ohl', keys:['f1aa699db3d81487','4767a11864244441','2976319eb44abe94'], label:'OHL', teams:[], fav:['LDN']},
    {type:'espn', sport:'hockey', league:'nhl', label:'NHL', teams:[], fav:['TOR']}
  ]
};
/* ================================ */
const $=id=>document.getElementById(id);
document.documentElement.dataset.theme=CFG.theme||'dusk';
const tfetch=(u,ms=8000)=>{let t;return Promise.race([fetch(u),new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error('timeout')),ms)})]).finally(()=>clearTimeout(t))};
const WX={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
let moonIcon='🌙';
const SVG=b=>`<svg viewBox="0 0 64 64" width="1em" height="1em" style="vertical-align:-.12em;overflow:visible">${b}</svg>`;
const SUN='<g stroke="#ffc83d" stroke-width="4" stroke-linecap="round">'+[0,45,90,135,180,225,270,315].map(a=>`<line x1="32" y1="6" x2="32" y2="13" transform="rotate(${a} 32 32)"/>`).join('')+'</g><circle cx="32" cy="32" r="12" fill="#ffc83d"/>';
const CLD=(f='#e4eaf7')=>`<path d="M17 48h31a9.5 9.5 0 0 0 1-18.9A14 14 0 0 0 22.5 26 11 11 0 0 0 17 48z" fill="${f}"/>`;
const ICON={
  sun:SVG(SUN),
  part:SVG('<g transform="translate(9 -7) scale(.72)">'+SUN+'</g>'+CLD()),
  cloud:SVG(CLD('#b9c3d9')),
  fog:SVG(CLD('#c9d1e3').replace('M17 48','M17 42').replace('h31','h31')+'<g stroke="#c9d1e3" stroke-width="4" stroke-linecap="round"><line x1="14" y1="50" x2="50" y2="50"/><line x1="20" y1="57" x2="44" y2="57"/></g>'),
  rain:SVG(CLD('#a9b6d1')+'<g stroke="#5db7ff" stroke-width="4" stroke-linecap="round"><line x1="24" y1="52" x2="21" y2="60"/><line x1="34" y1="52" x2="31" y2="60"/><line x1="44" y1="52" x2="41" y2="60"/></g>'),
  snow:SVG(CLD('#c3cde3')+'<g fill="#fff"><circle cx="23" cy="55" r="3"/><circle cx="33" cy="58" r="3"/><circle cx="43" cy="55" r="3"/></g>'),
  storm:SVG(CLD('#8c98b5')+'<path d="M34 46l-8 12h7l-3 8 11-14h-7l4-6z" fill="#ffd23d"/>')
};
const kind=c=>c===0||c===1?'sun':c===2?'part':c===3?'cloud':(c===45||c===48)?'fog':(c>=51&&c<=67)||(c>=80&&c<=82)?'rain':(c>=71&&c<=77)||c===85||c===86?'snow':c>=95?'storm':'part';
const WXT={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
const wx=(c,n)=>{const t=WXT[c]||'Mixed';
  if(n&&(c===0||c===1))return [moonIcon,t];
  if(n&&c===2)return [ICON.cloud,t];
  return [ICON[kind(c)],t]};
const fmt=d=>{const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return CFG.clock24?String(h).padStart(2,'0')+':'+m:(h%12||12)+':'+m+' '+(h<12?'AM':'PM')};

function tick(){
  const n=new Date();
  const mm=String(n.getMinutes()).padStart(2,'0'),h=n.getHours();
  $('time').innerHTML=CFG.clock24?String(h).padStart(2,'0')+':'+mm:(h%12||12)+':'+mm+'<small>'+(h<12?'AM':'PM')+'</small>';
  $('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
setInterval(tick,1000);tick();

function moon(){
  const p=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)/29.530588853%1+1)%1;
  const names=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  const i=Math.round(p*8)%8, lit=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  moonIcon=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i];$('moon').textContent=moonIcon;
  $('moontxt').innerHTML=names[i]+'<br>'+lit+'% lit';
}

async function weather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,apparent_temperature,weather_code,is_day&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto`;
    const d=await (await tfetch(u)).json(), c=d.current, dl=d.daily;
    const [ic,tx]=wx(c.weather_code,c.is_day===0);
    $('wxicon').innerHTML=ic;$('temp').textContent=Math.round(c.temperature_2m)+'°';
    $('wxdesc').textContent=tx;
    $('wxsub').textContent=`${CFG.city} · Feels ${Math.round(c.apparent_temperature)}° · H ${Math.round(dl.temperature_2m_max[0])}° L ${Math.round(dl.temperature_2m_min[0])}°`;
    $('fc').querySelector('.days').innerHTML=[1,2,3,4,5].map(i=>{
      const day=new Date(dl.time[i]+'T12:00').toLocaleDateString([],{weekday:'short'});
      return `<div class="day"><b>${day}</b><span>${wx(dl.weather_code[i])[0]}</span>${Math.round(dl.temperature_2m_max[i])}° <em>${Math.round(dl.temperature_2m_min[i])}°</em></div>`}).join('');
    $('sunrise').textContent=fmt(new Date(dl.sunrise[0]));$('sunset').textContent=fmt(new Date(dl.sunset[0]));
    const hr=d.hourly,t0=new Date();t0.setMinutes(0,0,0);
    let k=hr.time.findIndex(t=>new Date(t)>=t0);if(k<0)k=0;
    $('hours').innerHTML=[0,2,4,6,8,10].map(n=>{const i=k+n,h=new Date(hr.time[i]).getHours(),pp=hr.precipitation_probability[i];
      return `<div class="day"><b>${n?(h%12||12)+(h<12?' AM':' PM'):'Now'}</b><span>${wx(hr.weather_code[i],hr.is_day[i]===0)[0]}</span>${Math.round(hr.temperature_2m[i])}°${pp>=10?' <em>'+pp+'%</em>':''}</div>`}).join('');
  }catch(e){console.warn('weather',e)}
}

/* ---------- Up next: next game for each of your teams (checked every 30 min) ---------- */
let nextRows=[],nextAt=0;
const nextTime=d=>(dayTag(d)||'Today')+' '+fmt(d);
async function espnWeek(L){
  const pad=n=>String(n).padStart(2,'0'),out=[];
  await Promise.all([0,1,2,3,4,5,6,7].map(async i=>{const d=new Date(Date.now()+i*864e5);
    try{out.push(...await espnGames(L,'?dates='+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())))}catch(e){}}));
  return out;
}
async function nextUp(){
  if(Date.now()-nextAt<1800000)return;nextAt=Date.now();
  const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const q='?dates='+ymd(new Date())+'-'+ymd(new Date(Date.now()+7*864e5))+'&limit=300';
  const rows=[];
  const draw=()=>{rows.sort((a,b)=>a.date-b.date);nextRows=rows;$('nextList').innerHTML=rows.map(r=>`<div class="nx"><span class="tm">${logoImg(r.logo)}<span>${r.L.label} · ${r.at} ${r.opp}</span></span><span>${nextTime(r.date)}</span></div>`).join('')||'<div class="none">Checking schedules…</div>'};
  draw();
  await Promise.all(CFG.leagues.filter(L=>L.fav&&L.fav.length).map(async L=>{
    try{
      const gs=L.type==='hockeytech'?await hockeytechGames(L,7,true):await espnWeek(L);
      const g=gs.filter(g=>isFav(L,g)&&g.state==='pre'&&g.date>new Date()).sort((a,b)=>a.date-b.date)[0];
      if(g){const home=L.fav.includes(g.H);rows.push({L,date:g.date,at:home?'vs':'at',opp:home?g.nA:g.nH,logo:home?g.lA:g.lH});draw()}
    }catch(e){console.warn('next',L.label,e);if(!rows.length)$('nextList').innerHTML='<div class="none">Schedule unavailable ('+L.label+': '+(e.message||'error').slice(0,60)+')</div>'}
  }));
  if(!rows.length)$('nextList').innerHTML='<div class="none">No games coming up in the next week</div>';
}

/* ---------- Scores: one box per league + live scorebug for your teams ---------- */
const dayTag=d=>{const n=new Date();return isNaN(d)||d.toDateString()===n.toDateString()?'':d.toLocaleDateString([],{weekday:'short'})};
const preLabel=d=>(dayTag(d)?dayTag(d)+' ':'')+fmt(d);
const postLabel=(txt,d)=>(txt||'Final')+(dayTag(d)?' · '+dayTag(d):'');
const clockSecs=t=>{const m=String(t||'').match(/^(\d+):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null};
const perName=n=>n<=0?'':n<=3?['1st','2nd','3rd'][n-1]:n===5?'SO':'OT';

async function espnGames(L,q=''){
  const d=await (await tfetch(`https://site.api.espn.com/apis/site/v2/sports/${L.sport}/${L.league}/scoreboard${q}`)).json();
  const hockey=L.sport==='hockey';
  return (d.events||[]).map(e=>{
    const comp=e.competitions[0],c=comp.competitors,st=e.status.type,date=new Date(e.date);
    const away=c.find(x=>x.homeAway==='away'),home=c.find(x=>x.homeAway==='home');
    const A=away.team.abbreviation,H=home.team.abbreviation,pre=st.state==='pre';
    const sd=st.shortDetail||'',brk=/end|intermission|half|delay|postponed/i.test(sd),sit=comp.situation;
    const outs=(!hockey&&sit&&sit.outs!=null)?' · '+sit.outs+(sit.outs===1?' out':' outs'):'';
    return {id:e.id,A,H,nA:away.team.shortDisplayName||A,nH:home.team.shortDisplayName||H,lA:away.team.logo||'',lH:home.team.logo||'',sA:away.score,sH:home.score,state:st.state,date,
      line:pre?`${A} at ${H}`:`${A} ${away.score} – ${home.score} ${H}`,
      det:pre?preLabel(date):(st.state==='post'?postLabel(sd.split(' - ')[0],date):sd),
      live:{hockey,clock:(hockey&&!brk)?clockSecs(e.status.displayClock):null,per:hockey?perName(e.status.period):'',text:sd+outs}};
  });
}
function htDate(g){
  let d=new Date(g.GameDateISO8601||'');if(!isNaN(d))return d;
  const m=String(g.ScheduledTime||g.ScheduledFormattedTime||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]m)?/i),[y,mo,da]=String(g.Date||'').split('-').map(Number);
  if(m&&y){let h=+m[1];if(m[3])h=h%12+(/p/i.test(m[3])?12:0);return new Date(y,mo-1,da,h,+m[2])}
  return y?new Date(y,mo-1,da,12):new Date();
}
async function hockeytechGames(L,ahead=1,all=false){
  const why={};
  for(const key of L.keys){
    const url=`https://lscluster.hockeytech.com/feed/index.php?feed=modulekit&view=scorebar&numberofdaysback=1&numberofdaysahead=${ahead}&key=${key}&client_code=${L.code}&fmt=json&lang=en`;
    const enc=encodeURIComponent(url);
    const routes=[['direct',url],['proxy A','https://api.allorigins.win/raw?url='+enc],['proxy B','https://corsproxy.io/?url='+enc],['proxy C','https://api.codetabs.com/v1/proxy?quest='+url]];
    for(const [name,u] of routes){
      try{
        let txt=(await (await tfetch(u)).text()).trim();
        if(!/^[\[{]/.test(txt)){const a=txt.indexOf('('),b=txt.lastIndexOf(')');if(a>=0&&b>a)txt=txt.slice(a+1,b)}
        let j;try{j=JSON.parse(txt)}catch(e){why[name]='not JSON';continue}
        if(!j||!j.SiteKit){why[name]='bad reply';continue}
        const sb=Array.isArray(j.SiteKit.Scorebar)?j.SiteKit.Scorebar:[];
        const now=new Date(),pad=n=>String(n).padStart(2,'0');
        const todayISO=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
        return sb.map(g=>{
          const per=parseInt(g.Period,10)||0,clock=(g.GameClock||'').trim();
          const fin=g.Final==='1'||/final/i.test(g.GameStatus||'')||['3','4'].includes(String(g.Status))||['3','4'].includes(String(g.GameStatus))||(per>=3&&/^0?0:00$/.test(clock));
          const started=g.Started==='1'||String(g.Status)==='2'||String(g.GameStatus)==='2'||per>0;
          const gsx=String(g.GameStatus!==undefined?g.GameStatus:g.Status),known={'1':'pre','2':'in','3':'post','4':'post'};
          const state=g.Final==='1'?'post':(known[gsx]||(fin?'post':(started?'in':'pre')));
          const date=htDate(g);if(g.SeasonID)L.seasonId=g.SeasonID;
          const A=g.VisitorCode,H=g.HomeCode,perTxt=(g.PeriodNameShort&&!/^\d+$/.test(g.PeriodNameShort))?g.PeriodNameShort:perName(per);
          const brk=state==='in'&&(clockSecs(clock)===null||(clock==='00:00'&&per<3));
          return {id:g.ID||(A+H+g.Date),A,H,nA:A,nH:H,lA:g.VisitorLogo||'',lH:g.HomeLogo||'',sA:g.VisitorGoals,sH:g.HomeGoals,state,date,
            line:state==='pre'?`${A} at ${H}`:`${A} ${g.VisitorGoals} – ${g.HomeGoals} ${H}`,
            det:state==='pre'?preLabel(date):state==='post'?postLabel(/final/i.test(g.GameStatus||'')?g.GameStatus:('Final'+(per>3?' '+(g.PeriodNameShort||'OT'):'')),date):(perTxt+' '+clock).trim(),
            live:{hockey:true,clock:brk?null:clockSecs(clock),per:perTxt,text:brk?('End of '+perTxt):(perTxt+' '+clock).trim()},
            today:g.Date===todayISO||date.toDateString()===now.toDateString()};
        }).filter(g=>all||g.today);
      }catch(e){why[name]=(e&&e.message)||'error'}
    }
  }
  throw new Error(Object.entries(why).map(([k,v])=>k+': '+v).join(' · '));
}

let favGames=[],liveIdx=0,flashUntil=0;const prevScore={};
const isFav=(L,g)=>!!(L.fav&&L.fav.length&&(L.fav.includes(g.A)||L.fav.includes(g.H)));

async function sports(){
  const res=await Promise.all(CFG.leagues.map(async L=>{
    let games=[],failed=false,msg='';
    try{games=await (L.type==='hockeytech'?hockeytechGames(L,3,true):espnGames(L))}catch(e){failed=true;msg=e.message||'error';console.warn('scores',L.label,e)}
    return {L,games,failed,msg,at:Date.now()};
  }));
  /* your teams: live now, or starting within 30 minutes */
  const fav=[];
  res.forEach(r=>r.games.forEach(g=>{
    const f=isFav(r.L,g),mins=(g.date-Date.now())/60000;
    if(g.state==='in'||(f&&g.state==='pre'&&mins<=30&&mins>-10))fav.push({L:r.L,g,at:r.at,f});
    if(!f)return;
    const key=r.L.label+g.id,sc=g.sA+'-'+g.sH;
    if(g.state==='in'&&prevScore[key]!==undefined&&prevScore[key]!==sc)flashUntil=Date.now()+5000;
    prevScore[key]=sc;
  }));
  fav.sort((a,b)=>b.f-a.f);favGames=fav;renderLive();
  const rank={in:0,pre:1,post:2};
  lgData=res.map(({L,games,failed,msg})=>{
    let list=games.slice();
    if(L.teams&&L.teams.length)list=list.filter(g=>L.teams.includes(g.A)||L.teams.includes(g.H));
    let show=list.filter(g=>g.today===undefined||g.today),empty='No games today';
    if(!show.length&&list.length){const up=list.filter(g=>g.state==='pre').sort((a,b)=>a.date-b.date);if(up.length){show=up;empty=''}}
    show.sort((a,b)=>rank[a.state]-rank[b.state]||a.date-b.date);
    return {L,failed,msg,empty,rows:show.map(g=>`<div class="g"><b>${g.line}</b><span class="${g.state==='in'?'live':''}">${g.det}</span></div>`)};
  });
  drawLeagues();
}
let lgData=[],lgPage=0;const PER=4;
function drawLeagues(){
  $('leagues').innerHTML=lgData.map(({L,failed,msg,empty,rows})=>{
    const pages=Math.max(1,Math.ceil(rows.length/PER)),pg=lgPage%pages;
    const body=failed?'<div class="none">Scores unavailable</div><div class="why">'+msg+'</div>':(rows.slice(pg*PER,pg*PER+PER).join('')||'<div class="none">'+empty+'</div>');
    return `<div class="lg"><h3>${L.label}${pages>1?' <span class="pgn">'+(pg+1)+'/'+pages+'</span>':''}</h3>${body}</div>`;
  }).join('');
}
setInterval(()=>{lgPage++;drawLeagues()},7000);

/* Live scorebug: replaces the headlines card while one of your teams is playing */
const logoImg=u=>{if(!u)return '';const d=u.replace('/500/','/500-dark/');
  return `<img class="logo" src="${d}" data-f="${d!==u?u:''}" alt="" onerror="if(this.dataset.f){this.src=this.dataset.f;this.dataset.f=''}else{this.style.display='none'}">`};
const mmss=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function renderLive(){
  const box=$('live'),news=$('news');
  if(!favGames.length){box.style.display='none';news.style.display='';return}
  const it=favGames[liveIdx%favGames.length],g=it.g,L=it.L,pre=g.state==='pre';
  box.style.display='flex';news.style.display='none';
  box.classList.toggle('flash',Date.now()<flashUntil);
  $('lvTag').innerHTML='<i class="dot"></i>'+(pre?'Starting soon':'Live')+' · '+L.label;
  const f=L.fav||[];
  $('lvA').className='lvrow'+(f.includes(g.A)?' fav':'');$('lvH').className='lvrow'+(f.includes(g.H)?' fav':'');
  $('lvA').innerHTML='<span class="tm">'+logoImg(g.lA)+'<span>'+g.nA+'</span></span><span>'+(pre?'':g.sA)+'</span>';
  $('lvH').innerHTML='<span class="tm">'+logoImg(g.lH)+'<span>'+g.nH+'</span></span><span>'+(pre?'':g.sH)+'</span>';
  let txt;
  if(pre){const m=Math.round((g.date-Date.now())/60000);txt=(g.live.hockey?'Puck drop':L.sport==='baseball'?'First pitch':'Starts')+(m>0?' in '+m+' min':' now')}
  else if(g.live.clock!==null){const rem=Math.max(0,g.live.clock-Math.floor((Date.now()-it.at)/1000));txt=mmss(rem)+(g.live.per?' · '+g.live.per:'')}
  else txt=g.live.text;
  $('lvClock').textContent=txt;
}
setInterval(renderLive,1000);
setInterval(()=>{liveIdx++},7000);
async function sportsLoop(){
  try{await sports()}catch(e){console.warn('sports',e)}
  nextUp();standings();
  const live=favGames.some(x=>x.g.state==='in');
  setTimeout(sportsLoop,live?15000:favGames.length?60000:120000);   /* faster refresh while your team plays */
}

/* ---------- Standings pages (rotate with Up next) ---------- */
let stAt=0;
const stRow=(i,c,gp,pts,me)=>`<div class="st${me?' me':''}"><i>${i}</i><b>${c}</b><span>${gp} GP</span><em>${pts}</em></div>`;
const stHTML=(rows,fav)=>rows.slice(0,8).map((r,i)=>stRow(i+1,r.c,r.gp,r.pts,fav.includes(r.c))).join('');
const stFail=(id,e)=>{$(id).innerHTML='<div class="none">Standings unavailable<div class="why">'+(e.message||e)+'</div></div>';$(id).style.gridTemplateColumns='1fr'};
async function standings(){
  if(Date.now()-stAt<1800000)return;stAt=Date.now();
  const fav=L=>(L&&L.fav)||[];
  try{
    const d=await (await tfetch('https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings?level=3')).json();
    const find=n=>{if(/atlantic/i.test(n.name||'')&&n.standings)return n;for(const c of (n.children||[])){const r=find(c);if(r)return r}};
    const div=find(d);if(!div)throw new Error('Atlantic not found');
    const rows=div.standings.entries.map(e=>{const st=Object.fromEntries((e.stats||[]).map(x=>[x.name,x.value]));return {c:e.team.abbreviation,gp:st.gamesPlayed,pts:st.points}})
      .sort((a,b)=>b.pts-a.pts||a.gp-b.gp);
    $('stdNHL').innerHTML=stHTML(rows,fav(CFG.leagues.find(l=>l.league==='nhl')));$('stdNHL').style.gridTemplateColumns='';
  }catch(e){stFail('stdNHL',e)}
  const OL=CFG.leagues.find(l=>l.type==='hockeytech');
  if(OL)try{
    let rows=null,why='';
    const parse=t=>{t=t.trim();if(!/^[\[{]/.test(t)){const a=t.indexOf('('),b=t.lastIndexOf(')');if(a>=0&&b>a)t=t.slice(a+1,b)}return JSON.parse(t)};
    const get=async url=>{let last='';const enc=encodeURIComponent(url);
      for(const u of [url,'https://api.allorigins.win/raw?url='+enc,'https://corsproxy.io/?url='+enc,'https://api.codetabs.com/v1/proxy?quest='+url]){
        try{return parse(await (await tfetch(u)).text())}catch(e){last=e.message||'error'}}
      throw new Error(last)};
    const collect=j=>{const out=[];
      (function w(n,lab){
        if(Array.isArray(n))return n.forEach(x=>w(x,lab));
        if(!n||typeof n!=='object')return;
        if(n.headers&&n.headers.name&&typeof n.headers.name==='object')lab=n.headers.name.label||n.headers.name.title||lab;
        const l=[n.title,n.name,n.conference_name,n.conference,n.header,n.section_name].find(v=>typeof v==='string'&&/west|east/i.test(v));if(l)lab=l;
        const r=n.row||n;
        if(r.points!==undefined&&typeof r.points!=='object'&&(r.team_code||r.name||r.team_name)){out.push({c:r.team_code||r.name||r.team_name,gp:r.games_played||r.gp||'',pts:+r.points,ctx:String(r.conference_name||r.conference||lab||'')});return}
        Object.values(n).forEach(v=>w(v,lab));
      })(j,'');return out};
    for(const key of (OL.goodKey?[OL.goodKey]:OL.keys)){
      let sid=OL.seasonId||'';
      if(!sid)try{const sj=await get(`https://lscluster.hockeytech.com/feed/index.php?feed=modulekit&view=seasons&key=${key}&client_code=${OL.code}&fmt=json`);
        const ss=((sj.SiteKit||{}).Seasons||[]).filter(z=>String(z.playoff)!=='1'&&!/pre/i.test(z.season_name||''));
        if(ss.length)sid=String(Math.max(...ss.map(z=>+z.season_id)))}catch(e){}
      const base=`https://lscluster.hockeytech.com/feed/index.php?feed=statviewfeed&view=teams&groupTeamsBy=conference&context=overall&season=${sid}&special=false&key=${key}&client_code=${OL.code}&league_id=1&lang=en&division=-1&sort=points`;
      for(const url of [base+'&site_id=2',base+'&site_id=0',`https://lscluster.hockeytech.com/feed/index.php?feed=modulekit&view=statviewtype&stat=conference&type=standings&season_id=${sid}&key=${key}&client_code=${OL.code}&fmt=json&lang=en`]){
        try{
          const found=collect(await get(url));
          if(!found.length){why='empty reply (season '+(sid||'?')+')';continue}
          const west=found.filter(r=>/west/i.test(r.ctx));
          if(!west.length){why='no Western label; saw: '+[...new Set(found.map(r=>r.ctx||'-'))].slice(0,4).join(', ');continue}
          rows=west;break;
        }catch(e){why=e.message||'error'}
      }
      if(rows)break;
    }
    if(!rows)throw new Error(why||'failed');
    const seen=new Set();rows=rows.filter(r=>!seen.has(r.c)&&seen.add(r.c)).sort((a,b)=>b.pts-a.pts);
    $('stdOHL').innerHTML=stHTML(rows,fav(OL));$('stdOHL').style.gridTemplateColumns='';
  }catch(e){stFail('stdOHL',e)}
}
const pages=[['Up next · your teams','nextList'],['NHL · Atlantic Division','stdNHL'],['OHL · Western Conference','stdOHL']];let pg=0;
function showPage(){pages.forEach(([t,id],i)=>$(id).style.display=i===pg?'':'none');$('pgTitle').textContent=pages[pg][0]}
showPage();setInterval(()=>{pg=(pg+1)%pages.length;showPage()},10000);

/* ---------- Radar centred on your city (Rain Viewer free tier + CARTO base map) ---------- */
const RZ=7;let rFrames=[],rIdx=0;
async function radar(){
  try{
    const r=CFG.lat*Math.PI/180,n=2**RZ,x=(CFG.lon+180)/360*n,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n,cx=Math.floor(x),cy=Math.floor(y);
    const pos=(tx,ty)=>`left:${((tx-x)*256).toFixed(1)}px;top:${((ty-y)*256).toFixed(1)}px`;
    let h='<div class="rt">';
    for(let tx=cx-1;tx<=cx+1;tx++)for(let ty=cy-1;ty<=cy+1;ty++)h+=`<img src="https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/${RZ}/${ty}/${tx}" style="${pos(tx,ty)}" alt="" onerror="this.remove()">`;
    const W=40075016.68/n,O=20037508.34,bb=[O-0,0].length&&[-O+(cx-1)*W,O-(cy+2)*W,-O+(cx+2)*W,O-(cy-1)*W];
    const wms=`https://geo.weather.gc.ca/geomet?service=WMS&version=1.3.0&request=GetMap&layers=RADAR_1KM_RRAI,RADAR_1KM_RSNO&styles=&crs=EPSG:3857&bbox=${bb.join(',')}&width=768&height=768&format=image/png&transparent=true&_=${Date.now()}`;
    h+=`<img src="${wms}" style="${pos(cx-1,cy-1)};width:768px;height:768px;opacity:.8" alt="" onerror="this.remove()">`;
    h+='</div><div class="pin"></div><div class="mtime">Radar · '+fmt(new Date())+'</div><div class="mcap">Environment Canada radar · Map © Esri</div>';
    $('radar').innerHTML=h;rFrames=[];
  }catch(e){console.warn('radar',e)}
}
setInterval(radar,300000);

/* Keep pixels moving to avoid burn-in */
setInterval(()=>{const x=(Math.random()*2-1)*.8,y=(Math.random()*2-1)*.8;$('shift').style.transform=`translate(${x}vw,${y}vh)`},300000);

moon();weather();sportsLoop();radar();
setInterval(weather,900000);
setInterval(moon,3600000);
