<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fbf6f2;--dim:rgba(250,240,232,.68);--glass:rgba(255,255,255,.075);--edge:rgba(255,255,255,.15);
 --live:#ff5c6c;--bg:#0c0709;--b1:#ff7a45;--b2:#c2255c;--b3:#7a3aa8;--glow:.5}
:root[data-theme="graphite"]{--ink:#f5f6f8;--dim:rgba(235,238,244,.66);--bg:#08090b;--b1:#56627a;--b2:#2e3647;--b3:#6b7a94;--glow:.42}
:root[data-theme="forest"]{--ink:#f1f8f4;--dim:rgba(230,243,236,.66);--bg:#040b08;--b1:#12895f;--b2:#0e5c46;--b3:#2a7da0;--glow:.5}
:root[data-theme="midnight"]{--ink:#f4f6ff;--dim:rgba(235,240,255,.62);--bg:#04050d;--b1:#2b5cff;--b2:#9a3dff;--b3:#00d6b4;--glow:.55}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Manrope,"Helvetica Neue",Arial,sans-serif;overflow:hidden;cursor:none}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0}
.aurora i{position:absolute;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:var(--glow);animation:drift 50s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--b1);left:-15vw;top:-20vw}
.aurora i:nth-child(2){background:var(--b2);right:-20vw;top:5vw;animation-duration:65s}
.aurora i:nth-child(3){background:var(--b3);left:25vw;bottom:-35vw;opacity:calc(var(--glow)*.75);animation-duration:80s}
@keyframes drift{to{transform:translate(12vw,8vh) scale(1.2)}}
#shift{position:relative;z-index:1;height:100%;padding:4vh 4vw;display:grid;gap:2.2vh 1.6vw;
 grid-template-columns:1.1fr 1fr 1fr;grid-template-rows:1.05fr 1.05fr 1fr;
 grid-template-areas:"clock wx wx" "fc sun air" "news sports sports";transition:transform 4s ease}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:2.2vh;padding:2vh 1.5vw;
 backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);overflow:hidden;min-width:0;min-height:0}
.card h2{font-size:1.7vh;font-weight:600;color:var(--dim);margin-bottom:1.2vh;letter-spacing:.02em}
#clock{grid-area:clock;background:none;border:none;backdrop-filter:none;padding:0;display:flex;flex-direction:column;justify-content:center}
#time{white-space:nowrap;font-size:14vh;font-weight:200;line-height:1;letter-spacing:-.03em}
#time small{font-size:2.6vh;font-weight:300;margin-left:.8vw;color:var(--dim)}
#date{font-size:3.2vh;font-weight:300;color:var(--dim);margin-top:1.8vh}
#wx{grid-area:wx;display:flex;align-items:center;gap:2vw}
#wxicon{font-size:11vh}
#temp{font-size:11vh;font-weight:200;line-height:1}
#wxdesc{font-size:3vh;font-weight:300}
#wxsub{font-size:2.1vh;color:var(--dim);margin-top:.6vh}
#fc{grid-area:fc}.days{display:flex;justify-content:space-between;height:calc(100% - 3vh);align-items:center}
.day{text-align:center;font-size:1.9vh}.day b{display:block;font-weight:400;color:var(--dim);margin-bottom:.4vh}
.day span{display:block;font-size:3.6vh;margin:.3vh 0}.day em{font-style:normal;color:var(--dim)}
#sun{grid-area:sun}#air{grid-area:air}
.cols{display:flex;gap:1.2vw}.cols>div{flex:1;min-width:0}
.big{font-size:4.4vh;font-weight:200;line-height:1.1;white-space:nowrap}
.row{font-size:1.9vh;color:var(--dim);margin-top:.5vh}
.moonrow{display:flex;align-items:center;gap:1vw;margin-top:2vh}
#moon{font-size:5vh;line-height:1}#moontxt{font-size:2vh;color:var(--dim);line-height:1.3}
.meter{height:.9vh;border-radius:1vh;background:rgba(255,255,255,.12);margin-top:1.2vh;overflow:hidden}
.meter div{height:100%;border-radius:1vh;background:linear-gradient(90deg,#00d6b4,#ffd84a,#ff5c7a);transition:width 1s}
#news{grid-area:news}#sports{grid-area:sports}
.head{font-size:2.6vh;font-weight:300;line-height:1.3;transition:opacity .8s;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.head.sub{font-size:1.9vh;color:var(--dim);margin-top:1.1vh;-webkit-line-clamp:1}
.src{font-size:1.6vh;color:var(--dim);margin-top:1.2vh}
.leagues{display:flex;gap:1vw;height:calc(100% - 3vh)}
.lg{flex:1;min-width:0;background:rgba(255,255,255,.055);border-radius:1.6vh;padding:1.2vh .9vw;overflow:hidden}
.lg h3{font-size:1.8vh;font-weight:600;margin-bottom:.7vh}
.g{display:flex;justify-content:space-between;gap:.6vw;font-size:1.85vh;padding:.45vh 0;white-space:nowrap}
.g b{font-weight:400;overflow:hidden;text-overflow:ellipsis}.g span{color:var(--dim);font-size:1.6vh;flex:none;align-self:center}
.g .live{color:#ff6b8a}
.none{font-size:1.8vh;color:var(--dim)}
.why{font-size:1.4vh;color:var(--dim);opacity:.75;margin-top:.6vh;line-height:1.3}
#live{grid-area:news;display:none;flex-direction:column;justify-content:space-between;border-color:rgba(255,110,120,.5)}
.lvtag{font-size:1.8vh;font-weight:600;color:var(--dim);display:flex;align-items:center;gap:.6vw}
.dot{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--live);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;font-size:4.6vh;font-weight:300;line-height:1.12;font-variant-numeric:tabular-nums}
.lvrow.fav{font-weight:600}
.tm{display:flex;align-items:center;gap:.9vw;min-width:0}.tm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:5.2vh;height:5.2vh;object-fit:contain;flex:none;border-radius:50%;background:rgba(255,255,255,.1);padding:.4vh}
#lvClock{font-size:3vh;font-weight:400;font-variant-numeric:tabular-nums}
#live.flash{animation:flash 1s ease 5}
@keyframes flash{50%{background:rgba(255,255,255,.3)}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<main id="shift">
 <section id="clock" class="card"><div id="time"></div><div id="date"></div></section>
 <section id="wx" class="card"><div id="wxicon">⛅</div><div><div id="temp">--°</div><div id="wxdesc">Loading…</div><div id="wxsub"></div></div></section>
 <section id="fc" class="card"><h2>Next 5 days</h2><div class="days"></div></section>
 <section id="sun" class="card"><h2>Sun and moon</h2>
  <div class="cols"><div><div class="big" id="sunrise">--</div><div class="row">Sunrise</div></div>
  <div><div class="big" id="sunset">--</div><div class="row">Sunset</div></div></div>
  <div class="moonrow"><div id="moon"></div><div id="moontxt"></div></div></section>
 <section id="air" class="card"><h2>Air and UV</h2>
  <div class="cols"><div><div class="big" id="aqi">--</div><div class="row" id="aqitxt">Air quality</div><div class="meter"><div id="aqibar" style="width:0"></div></div></div>
  <div><div class="big" id="uv">--</div><div class="row" id="uvtxt">UV index</div><div class="meter"><div id="uvbar" style="width:0"></div></div></div></div></section>
 <section id="news" class="card"><h2>Headlines</h2><div class="head" id="h1">Loading headlines…</div><div class="head sub" id="h2"></div><div class="src" id="hsrc"></div></section>
 <section id="live" class="card"><div class="lvtag" id="lvTag"></div><div><div class="lvrow" id="lvA"></div><div class="lvrow" id="lvH"></div></div><div id="lvClock"></div></section>
 <section id="sports" class="card"><h2>Scores</h2><div class="leagues" id="leagues"></div></section>
</main>
<script>
/* ===== SETTINGS: edit these ===== */
const CFG={
  city:'Woodstock', lat:43.13, lon:-80.75,
  clock24:false,
  // Colour theme: 'dusk' (warm amber and rose), 'graphite' (neutral dark), 'forest' (green), 'midnight' (the original blue and violet)
  theme:'dusk',
  // News: every feed that loads is mixed together. Feeds that fail are skipped.
  newsFeeds:[
    {name:'Sportsnet',     url:'https://www.sportsnet.ca/feed/'},
    {name:'Sportsnet NHL', url:'https://www.sportsnet.ca/hockey/nhl/feed'},
    {name:'Sportsnet MLB', url:'https://www.sportsnet.ca/baseball/mlb/feed'},
    {name:'TSN',           url:'http://www.tsn.ca/datafiles/rss/Stories.xml'}
  ],
  // Scores: one box per league, shown left to right.
  // type 'espn' covers NHL, MLB, NBA etc. ('sport/league' as ESPN names them).
  // type 'hockeytech' covers the OHL (ESPN doesn't carry it).
  // fav: your teams. When one is live (or starts within 30 min) a live scorebug with game clock replaces the headlines.
  // teams: abbreviations to show only those games, e.g. ['TOR'] or ['LDN']. [] shows all games.
  leagues:[
    {type:'espn', sport:'baseball', league:'mlb', label:'MLB', teams:[], fav:['TOR']},
    {type:'hockeytech', code:'ohl', keys:['f1aa699db3d81487','4767a11864244441','2976319eb44abe94'], label:'OHL', teams:[], fav:['LDN']},
    {type:'espn', sport:'hockey', league:'nhl', label:'NHL', teams:[], fav:['TOR']}
  ]
};
/* ================================ */
const $=id=>document.getElementById(id);
document.documentElement.dataset.theme=CFG.theme||'dusk';
const tfetch=(u,ms=8000)=>{let t;return Promise.race([fetch(u),new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error('timeout')),ms)})]).finally(()=>clearTimeout(t))};
const WX={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['❄️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
const wx=c=>WX[c]||['⛅','Mixed'];
const fmt=d=>{const h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');return CFG.clock24?String(h).padStart(2,'0')+':'+m:(h%12||12)+':'+m+' '+(h<12?'AM':'PM')};

function tick(){
  const n=new Date();
  const mm=String(n.getMinutes()).padStart(2,'0'),h=n.getHours();
  $('time').innerHTML=CFG.clock24?String(h).padStart(2,'0')+':'+mm:(h%12||12)+':'+mm+'<small>'+(h<12?'AM':'PM')+'</small>';
  $('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
}
setInterval(tick,1000);tick();

function moon(){
  const p=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)/29.530588853%1+1)%1;
  const names=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
  const i=Math.round(p*8)%8, lit=Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  $('moon').textContent=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'][i];
  $('moontxt').innerHTML=names[i]+'<br>'+lit+'% lit';
}

async function weather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${CFG.lat}&longitude=${CFG.lon}&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto`;
    const d=await (await tfetch(u)).json(), c=d.current, dl=d.daily;
    const [ic,tx]=wx(c.weather_code);
    $('wxicon').textContent=ic;$('temp').textContent=Math.round(c.temperature_2m)+'°';
    $('wxdesc').textContent=tx;
    $('wxsub').textContent=`${CFG.city} · Feels like ${Math.round(c.apparent_temperature)}° · High ${Math.round(dl.temperature_2m_max[0])}° Low ${Math.round(dl.temperature_2m_min[0])}°`;
    $('fc').querySelector('.days').innerHTML=[1,2,3,4,5].map(i=>{
      const day=new Date(dl.time[i]+'T12:00').toLocaleDateString([],{weekday:'short'});
      return `<div class="day"><b>${day}</b><span>${wx(dl.weather_code[i])[0]}</span>${Math.round(dl.temperature_2m_max[i])}° <em>${Math.round(dl.temperature_2m_min[i])}°</em></div>`}).join('');
    $('sunrise').textContent=fmt(new Date(dl.sunrise[0]));$('sunset').textContent=fmt(new Date(dl.sunset[0]));
    const uv=Math.round(dl.uv_index_max[0]*10)/10;
    $('uv').textContent=uv;
    $('uvtxt').textContent='UV · '+(uv<3?'Low':uv<6?'Moderate':uv<8?'High':uv<11?'Very high':'Extreme');
    $('uvbar').style.width=Math.min(100,uv/11*100)+'%';
  }catch(e){console.warn('weather',e)}
  try{
    const a=await (await tfetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${CFG.lat}&longitude=${CFG.lon}&current=us_aqi`)).json();
    const v=Math.round(a.current.us_aqi);
    $('aqi').textContent=v;
    $('aqitxt').textContent='AQI · '+(v<=50?'Good':v<=100?'Moderate':v<=150?'Unhealthy for some':'Unhealthy');
    $('aqibar').style.width=Math.min(100,v/2)+'%';
  }catch(e){console.warn('air',e)}
}

/* ---------- News: mixes every feed that loads (3 routes per feed) ---------- */
function parseRSS(xml){
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.querySelectorAll('item > title, entry > title')].map(x=>x.textContent.trim()).filter(Boolean);
}
async function loadFeed(url){
  const enc=encodeURIComponent(url);
  const tries=[
    async()=>{const d=await (await tfetch('https://api.rss2json.com/v1/api.json?rss_url='+enc)).json();if(d.status&&d.status!=='ok')throw 0;return d.items.map(i=>i.title)},
    async()=>parseRSS(await (await tfetch('https://api.allorigins.win/raw?url='+enc)).text()),
    async()=>parseRSS(await (await tfetch('https://corsproxy.io/?url='+enc)).text())
  ];
  for(const t of tries){try{const r=await t();if(r&&r.length)return r}catch(e){}}
  return [];
}
let heads=[],hi=0;
async function news(){
  const lists=await Promise.all(CFG.newsFeeds.map(async f=>(await loadFeed(f.url)).slice(0,12).map(t=>({t,s:f.name}))));
  const mixed=[],seen=new Set();
  const junk=t=>t.length<15||/featured\s+\d+\s+item/i.test(t);
  for(let i=0;i<12;i++)lists.forEach(l=>{const h=l[i];if(h&&!junk(h.t)&&!seen.has(h.t)){seen.add(h.t);mixed.push(h)}});
  if(mixed.length){heads=mixed;hi=0;showHead();return}
  if(!heads.length){$('h1').textContent='Headlines couldn’t load. Retrying soon.';$('h2').textContent='';setTimeout(news,120000)}
}
function showHead(){
  if(!heads.length)return;
  const a=$('h1'),b=$('h2');a.style.opacity=b.style.opacity=0;
  setTimeout(()=>{const x=heads[hi%heads.length],y=heads[(hi+1)%heads.length];
    a.textContent=x.t;b.textContent=y.t;$('hsrc').textContent=x.s;a.style.opacity=1;b.style.opacity=1;hi+=2},800);
}
setInterval(showHead,12000);

/* ---------- Scores: one box per league + live scorebug for your teams ---------- */
const dayTag=d=>{const n=new Date();return d.toDateString()===n.toDateString()?'':d.toLocaleDateString([],{weekday:'short'})};
const preLabel=d=>(dayTag(d)?dayTag(d)+' ':'')+fmt(d);
const postLabel=(txt,d)=>(txt||'Final')+(dayTag(d)?' · '+dayTag(d):'');
const clockSecs=t=>{const m=String(t||'').match(/^(\d+):(\d{2})$/);return m?(+m[1])*60+(+m[2]):null};
const perName=n=>n<=0?'':n<=3?['1st','2nd','3rd'][n-1]:n===5?'SO':'OT';

async function espnGames(L){
  const d=await (await tfetch(`https://site.api.espn.com/apis/site/v2/sports/${L.sport}/${L.league}/scoreboard`)).json();
  const hockey=L.sport==='hockey';
  return (d.events||[]).map(e=>{
    const comp=e.competitions[0],c=comp.competitors,st=e.status.type,date=new Date(e.date);
    const away=c.find(x=>x.homeAway==='away'),home=c.find(x=>x.homeAway==='home');
    const A=away.team.abbreviation,H=home.team.abbreviation,pre=st.state==='pre';
    const sd=st.shortDetail||'',brk=/end|intermission|half|delay|postponed/i.test(sd),sit=comp.situation;
    const outs=(!hockey&&sit&&sit.outs!=null)?' · '+sit.outs+(sit.outs===1?' out':' outs'):'';
    return {id:e.id,A,H,nA:away.team.shortDisplayName||A,nH:home.team.shortDisplayName||H,lA:away.team.logo||'',lH:home.team.logo||'',sA:away.score,sH:home.score,state:st.state,date,
      line:pre?`${A} at ${H}`:`${A} ${away.score} – ${home.score} ${H}`,
      det:pre?preLabel(date):(st.state==='post'?postLabel(sd.split(' - ')[0],date):sd),
      live:{hockey,clock:(hockey&&!brk)?clockSecs(e.status.displayClock):null,per:hockey?perName(e.status.period):'',text:sd+outs}};
  });
}
async function hockeytechGames(L){
  const why={};
  for(const key of L.keys){
    const url=`https://lscluster.hockeytech.com/feed/index.php?feed=modulekit&view=scorebar&numberofdaysback=1&numberofdaysahead=1&key=${key}&client_code=${L.code}&fmt=json&lang=en`;
    const enc=encodeURIComponent(url);
    const routes=[['direct',url],['proxy A','https://api.allorigins.win/raw?url='+enc],['proxy B','https://corsproxy.io/?url='+enc],['proxy C','https://api.codetabs.com/v1/proxy?quest='+url]];
    for(const [name,u] of routes){
      try{
        const txt=(await (await tfetch(u)).text()).trim().replace(/^\(/,'').replace(/\)$/,'');
        let j;try{j=JSON.parse(txt)}catch(e){why[name]='not JSON';continue}
        if(!j||!j.SiteKit){why[name]='bad reply';continue}
        const sb=Array.isArray(j.SiteKit.Scorebar)?j.SiteKit.Scorebar:[];
        const now=new Date(),pad=n=>String(n).padStart(2,'0');
        const todayISO=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
        return sb.map(g=>{
          const per=parseInt(g.Period,10)||0,clock=(g.GameClock||'').trim();
          const fin=g.Final==='1'||/final/i.test(g.GameStatus||'')||['3','4'].includes(String(g.Status))||['3','4'].includes(String(g.GameStatus))||(per>=3&&/^0?0:00$/.test(clock));
          const started=g.Started==='1'||String(g.Status)==='2'||String(g.GameStatus)==='2'||per>0;
          const state=fin?'post':(started?'in':'pre');
          const date=new Date(g.GameDateISO8601||((g.Date||'')+'T'+(g.ScheduledTime||'00:00:00')));
          const A=g.VisitorCode,H=g.HomeCode,perTxt=g.PeriodNameShort||perName(per);
          const brk=state==='in'&&(clockSecs(clock)===null||(clock==='00:00'&&per<3));
          return {id:g.ID||(A+H+g.Date),A,H,nA:A,nH:H,lA:g.VisitorLogo||'',lH:g.HomeLogo||'',sA:g.VisitorGoals,sH:g.HomeGoals,state,date,
            line:state==='pre'?`${A} at ${H}`:`${A} ${g.VisitorGoals} – ${g.HomeGoals} ${H}`,
            det:state==='pre'?preLabel(date):state==='post'?postLabel(/final/i.test(g.GameStatus||'')?g.GameStatus:('Final'+(per>3?' '+(g.PeriodNameShort||'OT'):'')),date):(perTxt+' '+clock).trim(),
            live:{hockey:true,clock:brk?null:clockSecs(clock),per:perTxt,text:brk?('End of '+perTxt):(perTxt+' '+clock).trim()},
            today:g.Date?g.Date===todayISO:date.toDateString()===now.toDateString()};
        }).filter(g=>g.today);
      }catch(e){why[name]=(e&&e.message==='timeout')?'timed out':'blocked'}
    }
  }
  throw new Error(Object.entries(why).map(([k,v])=>k+': '+v).join(' · '));
}

let favGames=[],liveIdx=0,flashUntil=0;const prevScore={};
const isFav=(L,g)=>!!(L.fav&&L.fav.length&&(L.fav.includes(g.A)||L.fav.includes(g.H)));

async function sports(){
  const res=await Promise.all(CFG.leagues.map(async L=>{
    let games=[],failed=false,msg='';
    try{games=await (L.type==='hockeytech'?hockeytechGames(L):espnGames(L))}catch(e){failed=true;msg=e.message||'error';console.warn('scores',L.label,e)}
    return {L,games,failed,msg,at:Date.now()};
  }));
  /* your teams: live now, or starting within 30 minutes */
  const fav=[];
  res.forEach(r=>r.games.forEach(g=>{
    if(!isFav(r.L,g))return;
    const mins=(g.date-Date.now())/60000;
    if(g.state==='in'||(g.state==='pre'&&mins<=30&&mins>-10))fav.push({L:r.L,g,at:r.at});
    const key=r.L.label+g.id,sc=g.sA+'-'+g.sH;
    if(g.state==='in'&&prevScore[key]!==undefined&&prevScore[key]!==sc)flashUntil=Date.now()+5000;
    prevScore[key]=sc;
  }));
  favGames=fav;renderLive();
  const rank={in:0,pre:1,post:2};
  $('leagues').innerHTML=res.map(({L,games,failed,msg})=>{
    let list=games.slice();
    if(L.teams&&L.teams.length)list=list.filter(g=>L.teams.includes(g.A)||L.teams.includes(g.H));
    list.sort((a,b)=>rank[a.state]-rank[b.state]||a.date-b.date);
    const body=failed?'<div class="none">Scores unavailable</div><div class="why">'+msg+'</div>':
      (list.slice(0,4).map(g=>`<div class="g"><b>${g.line}</b><span class="${g.state==='in'?'live':''}">${g.det}</span></div>`).join('')||'<div class="none">No games today</div>');
    return `<div class="lg"><h3>${L.label}</h3>${body}</div>`;
  }).join('');
}

/* Live scorebug: replaces the headlines card while one of your teams is playing */
const logoImg=u=>{if(!u)return '';const d=u.replace('/500/','/500-dark/');
  return `<img class="logo" src="${d}" data-f="${d!==u?u:''}" alt="" onerror="if(this.dataset.f){this.src=this.dataset.f;this.dataset.f=''}else{this.style.display='none'}">`};
const mmss=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
function renderLive(){
  const box=$('live'),news=$('news');
  if(!favGames.length){box.style.display='none';news.style.display='';return}
  const it=favGames[liveIdx%favGames.length],g=it.g,L=it.L,pre=g.state==='pre';
  box.style.display='flex';news.style.display='none';
  box.classList.toggle('flash',Date.now()<flashUntil);
  $('lvTag').innerHTML='<i class="dot"></i>'+(pre?'Starting soon':'Live')+' · '+L.label;
  const f=L.fav||[];
  $('lvA').className='lvrow'+(f.includes(g.A)?' fav':'');$('lvH').className='lvrow'+(f.includes(g.H)?' fav':'');
  $('lvA').innerHTML='<span class="tm">'+logoImg(g.lA)+'<span>'+g.nA+'</span></span><span>'+(pre?'':g.sA)+'</span>';
  $('lvH').innerHTML='<span class="tm">'+logoImg(g.lH)+'<span>'+g.nH+'</span></span><span>'+(pre?'':g.sH)+'</span>';
  let txt;
  if(pre){const m=Math.round((g.date-Date.now())/60000);txt=(g.live.hockey?'Puck drop':L.sport==='baseball'?'First pitch':'Starts')+(m>0?' in '+m+' min':' now')}
  else if(g.live.clock!==null){const rem=Math.max(0,g.live.clock-Math.floor((Date.now()-it.at)/1000));txt=mmss(rem)+(g.live.per?' · '+g.live.per:'')}
  else txt=g.live.text;
  $('lvClock').textContent=txt;
}
setInterval(renderLive,1000);
setInterval(()=>{liveIdx++},8000);
async function sportsLoop(){
  try{await sports()}catch(e){console.warn('sports',e)}
  const live=favGames.some(x=>x.g.state==='in');
  setTimeout(sportsLoop,live?15000:favGames.length?60000:120000);   /* faster refresh while your team plays */
}

/* Keep pixels moving to avoid burn-in */
setInterval(()=>{const x=(Math.random()*2-1)*.8,y=(Math.random()*2-1)*.8;$('shift').style.transform=`translate(${x}vw,${y}vh)`},300000);

moon();weather();news();sportsLoop();
setInterval(weather,900000);setInterval(news,900000);
setInterval(moon,3600000);
</script>
